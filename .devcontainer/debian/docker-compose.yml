services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.debian
    volumes:
      - ../..:/xyz:cached
      - minikube-lab-claude:/home/container-user/.claude
      - minikube-lab-gemini:/home/container-user/.gemini
      - minikube-lab-ssh:/home/container-user/.ssh
      - minikube-lab-sshtemplate:/home/container/user/.sshtemplate
    command: sleep infinity

volumes:
  minikube-lab-claude:
  minikube-lab-gemini:
  minikube-lab-ssh:
  minikube-lab-sshtemplate: